<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="布典人生面料管理协同平台 —— 以面料数字资产为底座，打通样品管理、AI展示、销售服务与客户转化" />
    <title>布典人生 · 面料管理协同平台</title>
    <link rel="stylesheet" crossorigin href="./assets/index-BpH4toC7.css">
    <!-- ==================== 演示链接守卫（一客一码 · 固定 3 天） ==================== -->
    <!-- 下方 data-app-js 是主程序入口。若日后重新构建前端，请把新 bundle 文件名更新到该属性， -->
    <!-- 并把这段守卫脚本原样保留在新构建的 index.html 中。 -->
    <script data-app-js="./assets/index-bd-p1.js">
      (function () {
        'use strict';

        /* ============================ 配置区 ============================ */
        var TTL_MS = 3 * 24 * 60 * 60 * 1000; // 固定试用期：3 天（72 小时）

        // 签名密钥。改动会使所有已发出的链接立即失效，且必须同步修改本地
        // 《发链接工具.html》中完全相同的 SECRET 与 HASH_SEED。
        var SECRET = 'bdrc-2026-fabric-demo';
        var HASH_SEED = 0x9e3779b9;

        var LS_KEY = 'bd_demo_token'; // 校验通过后缓存令牌，客户收藏裸地址也能继续用

        // 到期页 / 拦截页底部显示的联系方式，改成你的微信 / 电话即可，支持 HTML。
        var CONTACT_HTML =
          '<p class="bd-contact">如需继续使用或开通正式版本，请联系您的专属顾问。</p>';
        /* ================================================================ */

        /* ---------- 与《发链接工具.html》保持一致的 cyrb53 哈希 ---------- */
        function hash53(str, seed) {
          var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
          for (var i = 0, ch; i < str.length; i++) {
            ch = str.charCodeAt(i);
            h1 = Math.imul(h1 ^ ch, 2654435761);
            h2 = Math.imul(h2 ^ ch, 1597334677);
          }
          h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
          h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
          return 4294967296 * (2097151 & h2) + (h1 >>> 0);
        }

        function b64uDecode(s) {
          s = s.replace(/-/g, '+').replace(/_/g, '/');
          while (s.length % 4) s += '=';
          return decodeURIComponent(escape(atob(s)));
        }

        /* 校验签名与结构，通过则返回 { iat: 签发时间毫秒 }，否则 null */
        function verify(token) {
          var parts = String(token || '').split('.');
          if (parts.length !== 2 || !parts[0] || !parts[1]) return null;
          var expect = hash53(parts[0] + '.' + SECRET, HASH_SEED).toString(16);
          if (expect !== parts[1].toLowerCase()) return null;
          try {
            var p = JSON.parse(b64uDecode(parts[0]));
            if (!p || typeof p.iat !== 'number' || !isFinite(p.iat)) return null;
            return p;
          } catch (e) { return null; }
        }

        /* 取服务器时间（防改本地时钟）；3 秒拿不到就退回本地时间 */
        function getServerTime() {
          return new Promise(function (resolve) {
            var done = false;
            var finish = function (t) { if (!done) { done = true; resolve(t); } };
            var timer = setTimeout(function () { finish(null); }, 3000);
            try {
              fetch(location.href, { method: 'HEAD', cache: 'no-store' })
                .then(function (r) {
                  var d = r.headers.get('Date') || r.headers.get('date');
                  var t = d ? Date.parse(d) : NaN;
                  clearTimeout(timer);
                  finish(isNaN(t) ? null : t);
                })
                .catch(function () { clearTimeout(timer); finish(null); });
            } catch (e) { clearTimeout(timer); finish(null); }
          });
        }

        /* ---------- 全屏遮罩（校验中 / 拦截 / 到期） ---------- */
        var overlay = document.createElement('div');
        overlay.id = 'bd-guard-overlay';
        var guardStyle = document.createElement('style');
        var baseTitle = document.title;
        guardStyle.textContent = [
          '#bd-guard-overlay{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#f6f2ec;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#3d3630;}',
          '#bd-guard-overlay .bd-card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(61,54,48,.12);padding:44px 52px;max-width:420px;margin:20px;text-align:center;}',
          '#bd-guard-overlay .bd-logo{width:46px;height:46px;margin:0 auto 14px;display:block;}',
          '#bd-guard-overlay .bd-brand{font-size:12px;letter-spacing:.35em;color:#a08d76;margin-bottom:18px;}',
          '#bd-guard-overlay h1{font-size:20px;font-weight:600;margin:0 0 12px;color:#3d3630;}',
          '#bd-guard-overlay p{font-size:14px;line-height:1.9;margin:0;color:#6b6156;}',
          '#bd-guard-overlay .bd-contact{margin-top:18px;padding-top:16px;border-top:1px dashed #e3d9cb;color:#8a6d4e;}',
          '#bd-guard-overlay.bd-checking .bd-logo{animation:bd-pulse 1.2s ease-in-out infinite;}',
          '@keyframes bd-pulse{0%,100%{opacity:1}50%{opacity:.35}}'
        ].join('');

        function fmtDate(ts) {
          var d = new Date(ts);
          return (d.getMonth() + 1) + '月' + d.getDate() + '日';
        }

        function render(state, info) {
          overlay.className = state === 'checking' ? 'bd-checking' : '';
          var body = '';
          if (state === 'checking') {
            body = '<h1>正在验证访问权限…</h1><p>请稍候</p>';
            document.title = '布典人生 · 正在验证';
          } else if (state === 'nolink') {
            body = '<h1>请使用专属链接访问</h1><p>本页面需要通过顾问发送给您的那条演示链接打开。</p>' + CONTACT_HTML;
            document.title = '布典人生 · 请使用专属链接';
          } else if (state === 'invalid') {
            body = '<h1>链接无效</h1><p>这条链接不完整或已被改动，请向您的顾问重新获取。</p>' + CONTACT_HTML;
            document.title = '布典人生 · 链接无效';
          } else if (state === 'expired') {
            body = '<h1>试用期已结束</h1>' +
              '<p>本次演示试用期为 <b>' + fmtDate(info.iat) + '</b> 至 <b>' + fmtDate(info.exp) + '</b>（3 天），现已到期。</p>' +
              CONTACT_HTML;
            document.title = '布典人生 · 试用期已结束';
          }
          overlay.innerHTML =
            '<div class="bd-card">' +
              '<img class="bd-logo" src="./favicon.svg" alt="布典人生">' +
              '<div class="bd-brand">布典人生 · 面料管理协同平台</div>' + body +
            '</div>';
        }

        function fail(state, info) {
          render(state, info);
          try { localStorage.removeItem(LS_KEY); } catch (e) {}
        }

        function pass(token) {
          try { localStorage.setItem(LS_KEY, token); } catch (e) {}
          overlay.remove();
          guardStyle.remove();
          document.title = baseTitle;
          var src = document.querySelector('script[data-app-js]').getAttribute('data-app-js');
          var s = document.createElement('script');
          s.type = 'module';
          s.setAttribute('crossorigin', '');
          s.src = src;
          document.head.appendChild(s);
        }

        function boot() {
          document.documentElement.appendChild(guardStyle);
          document.documentElement.appendChild(overlay);
          // 解析期先挂在 <html> 下立即生效；DOM 就绪后挪进 <body>，保证可访问性与正常文档结构
          document.addEventListener('DOMContentLoaded', function () {
            if (overlay.parentNode) document.body.appendChild(overlay);
            if (guardStyle.parentNode) document.head.appendChild(guardStyle);
          });
          render('checking');

          var queryToken = null;
          try { queryToken = new URLSearchParams(location.search).get('k'); } catch (e) {}
          var savedToken = null;
          try { savedToken = localStorage.getItem(LS_KEY); } catch (e) {}

          var candidates = [];
          if (queryToken) candidates.push(queryToken);
          if (savedToken && savedToken !== queryToken) candidates.push(savedToken);

          if (!candidates.length) { fail('nolink'); return; }

          getServerTime().then(function (now) {
            if (now === null) now = Date.now();
            var expired = null;
            for (var i = 0; i < candidates.length; i++) {
              var p = verify(candidates[i]);
              if (!p) continue;
              if (now >= p.iat + TTL_MS) {
                if (!expired) expired = { iat: p.iat, exp: p.iat + TTL_MS };
                continue; // 这条过期了，再看看有没有别的候选（如续期后的缓存令牌）
              }
              pass(candidates[i]);
              return;
            }
            if (expired) fail('expired', expired);
            else fail(queryToken ? 'invalid' : 'nolink');
          });
        }

        boot();
      })();
    </script>
    <!-- ==================== /演示链接守卫 ==================== -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>本页面需要启用 JavaScript 才能访问。</noscript>
  </body>
</html>
